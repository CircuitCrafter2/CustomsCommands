[build-system]
requires = ["hatchling<=1.18.0"]  
build-backend = "hatchling.build"

[project]
name = "endstone_customscommands"
version = "0.3.0"
dependencies = []
authors = [
    { name = "palm1" },
]
description = "Create your own slash commands in-game for Endstone (based on EasyAsCommands by palm1)."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "customscommands", "commands", "server"]

[project.urls]
Homepage = "https://github.com/CircuitCrafter2/CustomCommands"

[project.entry-points."endstone"]
customscommands = "endstone_customscommands:CustomsCommands"